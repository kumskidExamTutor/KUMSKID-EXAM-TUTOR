<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - KUMSKID Exam Tutor</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020f2b;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
background:#0c1f4d;
padding:30px;
border-radius:15px;
width:100%;
max-width:450px;
color:white;
}

h1{
text-align:center;
margin-bottom:25px;
}

.input-group{
margin-bottom:15px;
}

label{
display:block;
margin-bottom:5px;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:#2d8cff;
border:none;
border-radius:10px;
color:white;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

#message{
margin-top:15px;
text-align:center;
font-weight:bold;
}

.register-link{
text-align:center;
margin-top:20px;
}

.register-link a{
color:#2d8cff;
text-decoration:none;
}

</style>
</head>

<body>

<div class="container">

<h1>Student Login</h1>

<div class="input-group">
<label>Email Address</label>
<input type="email" id="email">
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password">
</div>

<button onclick="loginUser()">
Login
</button>

<div id="message"></div>

<div class="register-link">
Don't have an account?
<a href="register.html">Register</a>
</div>

</div>

<script>

async function loginUser(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

if(!email || !password){

document.getElementById("message").innerHTML =
"Please fill all fields.";

return;

}

document.getElementById("message").innerHTML =
"Logging in...";

try{

const { data, error } =
await supabaseClient.auth.signInWithPassword({

email: email,
password: password

});

if(error){

document.getElementById("message").innerHTML =
"❌ " + error.message;

return;

}

localStorage.setItem(
"userLoggedIn",
"true"
);

document.getElementById("message").innerHTML =
"✅ Login Successful";

setTimeout(()=>{

window.location.href =
"dashboard.html";

},1000);

}
catch(err){

document.getElementById("message").innerHTML =
"❌ Login Failed";

console.log(err);

}

}

</script>

</body>
</html>
