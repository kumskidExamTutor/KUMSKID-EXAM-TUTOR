<!DOCTYPE html>
<html>
<head>
<title>KUMSKID Exam Result</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:#02133b;
color:white;
text-align:center;
}

.result-box{
background:#10245c;
padding:30px;
border-radius:15px;
max-width:500px;
margin:auto;
margin-top:50px;
}

h1{
font-size:40px;
margin-bottom:20px;
}

.score{
font-size:35px;
font-weight:bold;
color:#4da3ff;
}

.info{
font-size:22px;
margin-top:20px;
}

.pass{
color:#00ff88;
font-weight:bold;
}

.fail{
color:#ff4d4d;
font-weight:bold;
}

button{
margin-top:30px;
padding:15px 30px;
font-size:18px;
border:none;
border-radius:10px;
background:#3d8bfd;
color:white;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

</style>
</head>

<body>

<div class="result-box">

<h1>🏆 Exam Result</h1>

<div class="score" id="score">
0 / 0
</div>

<div class="info">
Percentage:
<span id="percentage">0%</span>
</div>

<div class="info">
Status:
<span id="status">Pending</span>
</div>

<button onclick="goHome()">
Back To Dashboard
</button>

</div>

<script>

let score =
localStorage.getItem("examScore") || 0;

let total =
localStorage.getItem("examTotal") || 5;

let percent =
Math.round((score/total)*100);

document.getElementById("score").innerHTML =
score + " / " + total;

document.getElementById("percentage").innerHTML =
percent + "%";

if(percent >= 50){

document.getElementById("status").innerHTML =
"<span class='pass'>PASS ✅</span>";

}else{

document.getElementById("status").innerHTML =
"<span class='fail'>FAIL ❌</span>";

}

function goHome(){

window.location.href="dashboard.html";

}

</script>

</body>
</html>
