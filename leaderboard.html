<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leaderboard</title>

<style>

body{
background:#020f2b;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
}

h1{
text-align:center;
}

.table{
background:#0c1f4d;
padding:20px;
border-radius:15px;
margin-top:20px;
}

.row{
display:flex;
justify-content:space-between;
padding:12px;
border-bottom:1px solid #1f3b7a;
}

.rank{
font-weight:bold;
color:gold;
}

</style>
</head>

<body>

<div class="container">

<h1>🏆 Student Leaderboard</h1>

<div class="table" id="leaderboard">

Loading leaderboard...

</div>

</div>

<script>

let history =
JSON.parse(localStorage.getItem("examHistory")) || [];

let leaderboard =
document.getElementById("leaderboard");

if(history.length === 0){

leaderboard.innerHTML =
"No results available yet.";

}
else{

history.sort((a,b)=>
b.percentage - a.percentage
);

let html = "";

history.forEach((result,index)=>{

html += `

<div class="row">

<div>
<span class="rank">
#${index+1}
</span>

${result.subject}
</div>

<div>
${result.percentage}%
</div>

</div>

`;

});

leaderboard.innerHTML = html;

}

</script>

</body>
</html>
