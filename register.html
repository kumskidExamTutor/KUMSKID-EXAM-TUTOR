<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - KUMSKID Exam Tutor</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020f2b;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
background:#0c1f4d;
padding:30px;
border-radius:15px;
width:100%;
max-width:450px;
color:white;
}

h1{
text-align:center;
margin-bottom:25px;
}

.input-group{
margin-bottom:15px;
}

label{
display:block;
margin-bottom:5px;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:#2d8cff;
border:none;
border-radius:10px;
color:white;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

button:hover{
opacity:.9;
}

.login-link{
text-align:center;
margin-top:20px;
}

.login-link a{
color:#2d8cff;
text-decoration:none;
}

#message{
margin-top:15px;
text-align:center;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>Create Account</h1>

<div class="input-group">
<label>Full Name</label>
<input type="text" id="name">
</div>

<div class="input-group">
<label>Email Address</label>
<input type="email" id="email">
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password">
</div>

<button onclick="registerUser()">
Register
</button>

<div id="message"></div>

<div class="login-link">
Already have an account?
<a href="login.html">Login</a>
</div>

</div>

<script>

function registerUser(){

const name =
document.getElementById("name").value;

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

if(!name || !email || !password){

document.getElementById("message").innerHTML =
"Please fill all fields.";

return;

}

localStorage.setItem("studentName",name);
localStorage.setItem("studentEmail",email);

document.getElementById("message").innerHTML =
"✅ Registration Successful";

setTimeout(()=>{

window.location.href="login.html";

},1500);

}

</script>

</body>
</html>
