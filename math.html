<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WAEC Mathematics CBT</title>

<style>

body{
font-family:Arial,sans-serif;
background:#020f2b;
color:white;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
background:#0c1f4d;
padding:25px;
border-radius:15px;
}

h1{
text-align:center;
}

#question{
font-size:22px;
margin:20px 0;
}

.option{
display:block;
padding:12px;
margin:10px 0;
background:#132b66;
border-radius:10px;
cursor:pointer;
}

button{
margin-top:20px;
padding:12px 25px;
background:#2d8cff;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

#result{
font-size:24px;
text-align:center;
margin-top:20px;
}

</style>
</head>

<body>

<div class="container">

<h1>WAEC Mathematics CBT</h1>

<h3 id="counter"></h3>

<div id="question"></div>

<div id="options"></div>

<button onclick="nextQuestion()">
Next Question
</button>

<div id="result"></div>

</div>

<script>

const questions = [

{
question:"What is 2 + 2 ?",
options:["3","4","5","6"],
answer:"4"
},

{
question:"What is 5 × 3 ?",
options:["15","10","12","18"],
answer:"15"
},

{
question:"What is 10 ÷ 2 ?",
options:["2","5","8","4"],
answer:"5"
},

{
question:"What is 7 + 8 ?",
options:["13","14","15","16"],
answer:"15"
},

{
question:"What is 9 - 4 ?",
options:["3","4","5","6"],
answer:"5"
}

];

let currentQuestion = 0;
let score = 0;

loadQuestion();

function loadQuestion(){

document.getElementById("counter").innerHTML =
"Question " + (currentQuestion+1) + " of " + questions.length;

document.getElementById("question").innerHTML =
questions[currentQuestion].question;

let optionsHtml="";

questions[currentQuestion].options.forEach(option=>{

optionsHtml += `
<label class="option">
<input type="radio" name="answer" value="${option}">
 ${option}
</label>
`;

});

document.getElementById("options").innerHTML =
optionsHtml;

}

function nextQuestion(){

const selected =
document.querySelector('input[name="answer"]:checked');

if(!selected){

alert("Please select an answer");

return;

}

if(selected.value === questions[currentQuestion].answer){

score++;

}

currentQuestion++;

if(currentQuestion < questions.length){

loadQuestion();

}else{

document.querySelector(".container").innerHTML =

`
<h1>Exam Completed</h1>

<div id="result">

✅ Your Score: ${score} / ${questions.length}

<br><br>

Percentage:

${Math.round((score/questions.length)*100)}%

</div>
`;

}

}

</script>

</body>
</html>
