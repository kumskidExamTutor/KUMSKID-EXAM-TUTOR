<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAEC English CBT</title>

<style>
body{
font-family:Arial,sans-serif;
background:#020f2b;
color:white;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
background:#0c1f4d;
padding:25px;
border-radius:15px;
}

h1{
text-align:center;
}

#timer{
font-size:22px;
text-align:center;
margin:15px 0;
color:#2d8cff;
font-weight:bold;
}

#counter{
text-align:center;
margin-bottom:20px;
}

#question{
font-size:22px;
margin:20px 0;
}

.option{
display:block;
padding:12px;
margin:10px 0;
background:#132b66;
border-radius:10px;
cursor:pointer;
}

.buttons{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-top:20px;
}

button{
padding:12px 25px;
background:#2d8cff;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

#result{
font-size:24px;
text-align:center;
margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>WAEC English CBT</h1>

<div id="timer">Time Left: 10:00</div>

<h3 id="counter"></h3>

<div id="question"></div>

<div id="options"></div>

<div class="buttons">

<button onclick="previousQuestion()">
Previous
</button>

<button onclick="nextQuestion()">
Next
</button>

<button onclick="submitExam()">
Submit Exam
</button>

</div>

</div>

<script>

const questions = [

{
question:"Choose the correctly spelt word.",
options:["Accomodation","Accommodation","Acommodation","Acommodatoin"],
answer:"Accommodation"
},

{
question:"Select the synonym of 'Happy'.",
options:["Sad","Joyful","Angry","Weak"],
answer:"Joyful"
},

{
question:"Choose the correct sentence.",
options:[
"He go to school everyday",
"He goes to school every day",
"He going to school every day",
"He gone to school everyday"
],
answer:"He goes to school every day"
},

{
question:"Identify the noun in the sentence: 'The boy kicked the ball.'",
options:["kicked","the","boy","ball"],
answer:"boy"
},

{
question:"Choose the opposite of 'Brave'.",
options:["Bold","Fearful","Strong","Wise"],
answer:"Fearful"
}

];

let currentQuestion = 0;
let userAnswers = new Array(questions.length).fill(null);

let timeLeft = 600;

const timer = setInterval(() => {

let minutes = Math.floor(timeLeft / 60);
let seconds = timeLeft % 60;

document.getElementById("timer").innerHTML =
`Time Left: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

timeLeft--;

if(timeLeft < 0){

clearInterval(timer);

submitExam();

}

},1000);

loadQuestion();

function loadQuestion(){

document.getElementById("counter").innerHTML =
`Question ${currentQuestion + 1} of ${questions.length}`;

document.getElementById("question").innerHTML =
questions[currentQuestion].question;

let html = "";

questions[currentQuestion].options.forEach(option => {

const checked =
userAnswers[currentQuestion] === option
? "checked"
: "";

html += `
<label class="option">
<input type="radio"
name="answer"
value="${option}"
${checked}>
 ${option}
</label>
`;

});

document.getElementById("options").innerHTML = html;

}

function saveAnswer(){

const selected =
document.querySelector('input[name="answer"]:checked');

if(selected){

userAnswers[currentQuestion] =
selected.value;

}

}

function nextQuestion(){

saveAnswer();

if(currentQuestion < questions.length - 1){

currentQuestion++;

loadQuestion();

}

}

function previousQuestion(){

saveAnswer();

if(currentQuestion > 0){

currentQuestion--;

loadQuestion();

}

}

function submitExam(){

localStorage.setItem("examScore", score);

localStorage.setItem("examTotal", questions.length);

window.location.href = "result.html";

 }

saveAnswer();

clearInterval(timer);

let score = 0;

for(let i=0;i<questions.length;i++){

if(userAnswers[i] === questions[i].answer){

score++;

}

}

let percentage =
Math.round((score/questions.length)*100);

document.querySelector(".container").innerHTML = `

<h1>English Exam Submitted</h1>

<div id="result">

✅ Score: ${score}/${questions.length}

<br><br>

📊 Percentage: ${percentage}%

<br><br>

${percentage >= 70
? "🎉 Excellent Work!"
: "📚 Keep Practicing!"}

</div>

`;

}

</script>

</body>
  </html>
