<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Performance Analysis</title>

<style>

body{
background:#020f2b;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
}

h1{
text-align:center;
}

button{
width:100%;
padding:12px;
background:#2d8cff;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
margin-top:15px;
}

.result{
background:#0c1f4d;
padding:20px;
border-radius:15px;
margin-top:20px;
white-space:pre-wrap;
}

</style>
</head>

<body>

<div class="container">

<h1>📈 AI Performance Analysis</h1>

<button onclick="analyzeResults()">
Analyze My Performance
</button>

<div id="result" class="result">

Click the button above to receive AI analysis.

</div>

</div>

<script>

async function analyzeResults(){

let history =
JSON.parse(localStorage.getItem("examHistory")) || [];

if(history.length === 0){

document.getElementById("result").innerHTML =
"No exam history found.";

return;

}

document.getElementById("result").innerHTML =
"🤖 Analyzing your performance...";

try{

const response = await fetch(
"https://kumskid-nova-ai.pages.dev/groq",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

model:"llama-3.3-70b-versatile",

messages:[
{
role:"system",
content:`
You are KUMSKID AI Academic Coach.

Analyze student exam results.

Identify:

1. Strongest subject
2. Weakest subject
3. Improvement advice
4. Study plan
5. Motivation

Use simple language.
`
},
{
role:"user",
content:
"Exam History: " +
JSON.stringify(history)
}
],

temperature:0.5

})
}
);

const data = await response.json();

let answer =
data.choices?.[0]?.message?.content ||
"No analysis generated.";

document.getElementById("result").innerText =
answer;

}
catch(error){

document.getElementById("result").innerHTML =
"❌ Error analyzing results.";

console.log(error);

}

}

</script>

</body>
</html>
