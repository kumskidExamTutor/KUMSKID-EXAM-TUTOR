<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PalmPay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 16px 0 0 0;
        }

        /* Main phone frame */
        .phone {
            width: 393px;
            min-height: 852px;
            background: #f8f5ff;
            border-radius: 44px;
            box-shadow: 0 20px 60px rgba(90, 24, 154, 0.15), 0 8px 24px rgba(0,0,0,0.08);
            overflow: hidden;
            position: relative;
            padding-bottom: 90px;
            border: 1px solid rgba(90, 24, 154, 0.08);
        }

        /* Status bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 28px 8px;
            font-size: 12px;
            font-weight: 600;
            color: #333;
            background: #f8f5ff;
        }

        .status-bar .time {
            font-weight: 700;
            font-size: 14px;
        }
        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .status-icons svg {
            width: 18px;
            height: 18px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 20px 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left .greeting {
            font-size: 13px;
            color: #888;
            font-weight: 400;
        }
        .header-left .greeting strong {
            display: block;
            font-size: 17px;
            font-weight: 700;
            color: #1a1a2e;
            margin-top: 1px;
        }

        .header-right {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .header-right .icon-btn {
            background: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            cursor: pointer;
            font-size: 18px;
            color: #5a189a;
        }

        /* Balance Card */
        .balance-card {
            background: linear-gradient(135deg, #5a189a 0%, #3c096c 40%, #240046 100%);
            margin: 4px 16px 16px;
            border-radius: 24px;
            padding: 24px 22px 22px;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(90, 24, 154, 0.25);
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: -40%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
            border-radius: 50%;
        }

        .balance-card::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(156, 66, 245, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .balance-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            position: relative;
            z-index: 1;
        }

        .balance-label {
            font-size: 13px;
            font-weight: 400;
            opacity: 0.85;
            letter-spacing: 0.3px;
        }

        .balance-visibility {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            backdrop-filter: blur(4px);
        }

        .balance-amount {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.5px;
            position: relative;
            z-index: 1;
            margin: 2px 0 6px;
        }

        .balance-amount .currency {
            font-size: 20px;
            font-weight: 600;
            margin-right: 2px;
        }

        .balance-row {
            display: flex;
            gap: 24px;
            position: relative;
            z-index: 1;
            margin-top: 8px;
        }

        .balance-row .item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            opacity: 0.85;
        }
        .balance-row .item svg {
            width: 14px;
            height: 14px;
            fill: rgba(255,255,255,0.6);
        }
        .balance-row .item strong {
            font-weight: 600;
            opacity: 1;
        }

        /* Quick Actions */
        .quick-actions {
            display: flex;
            justify-content: space-around;
            padding: 6px 16px 16px;
            gap: 4px;
        }

        .quick-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
            flex: 1;
        }

        .quick-action .icon-circle {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            transition: transform 0.15s ease;
        }

        .quick-action:active .icon-circle {
            transform: scale(0.92);
        }

        .quick-action .label {
            font-size: 11px;
            font-weight: 500;
            color: #444;
        }

        .qa-transfer .icon-circle { background: #e8d5f5; color: #5a189a; }
        .qa-airtime .icon-circle { background: #d5f0e8; color: #0d7a5f; }
        .qa-data .icon-circle { background: #d5e8f5; color: #1a5a9a; }
        .qa-bills .icon-circle { background: #f5e8d5; color: #b86b1a; }
        .qa-more .icon-circle { background: #f0d5f5; color: #9a1a8a; }

        /* Features / Services Grid */
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px 8px;
        }

        .section-title h3 {
            font-size: 17px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .section-title a {
            font-size: 13px;
            color: #5a189a;
            text-decoration: none;
            font-weight: 500;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            padding: 0 16px 8px;
        }

        .service-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 12px 4px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 12px;
            transition: background 0.15s;
        }

        .service-item:active {
            background: rgba(90, 24, 154, 0.06);
        }

        .service-item .s-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 2px;
        }

        .service-item .s-label {
            font-size: 10px;
            font-weight: 500;
            color: #444;
            text-align: center;
            line-height: 1.2;
        }

        /* Savings & Investment section */
        .savings-carousel {
            display: flex;
            gap: 12px;
            padding: 0 16px 12px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .savings-carousel::-webkit-scrollbar { display: none; }

        .savings-card {
            min-width: 160px;
            background: white;
            border-radius: 18px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            border: 1px solid rgba(90,24,154,0.06);
            flex-shrink: 0;
        }

        .savings-card .sc-title {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 2px;
        }
        .savings-card .sc-rate {
            font-size: 22px;
            font-weight: 800;
            color: #5a189a;
        }
        .savings-card .sc-rate span {
            font-size: 13px;
            font-weight: 500;
            color: #888;
        }
        .savings-card .sc-desc {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }
        .savings-card .sc-bal {
            font-size: 14px;
            font-weight: 700;
            color: #1a1a2e;
            margin-top: 8px;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #f0eaf8;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 12px;
            border-radius: 0 0 44px 44px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 10px;
            color: #999;
            font-weight: 500;
            padding: 4px 12px;
            transition: color 0.15s;
        }

        .nav-item.active {
            color: #5a189a;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .nav-item.active svg {
            fill: #5a189a;
        }

        /* Hidden overlay for tap actions */
        .tap-feedback {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(90,24,154,0.1);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            backdrop-filter: blur(4px);
        }

        .tap-feedback.show {
            display: flex;
        }

        .tap-feedback .modal {
            background: white;
            border-radius: 24px;
            padding: 32px 28px 24px;
            width: 320px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            animation: popIn 0.25s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .tap-feedback .modal .m-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .tap-feedback .modal h3 {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 6px;
        }
        .tap-feedback .modal p {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 18px;
        }
        .tap-feedback .modal .btn-close {
            background: #5a189a;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
        }
        .tap-feedback .modal .btn-close:active {
            opacity: 0.8;
        }

        .hidden-balance {
            filter: blur(20px);
            user-select: none;
        }

        /* Notification badge */
        .badge-dot {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            background: #ef4444;
            border: 2px solid #f8f5ff;
            border-radius: 50%;
        }

        .icon-btn {
            position: relative;
        }

        /* Small tweaks */
        .mt-2 { margin-top: 2px; }
        .text-muted { color: #999; font-size: 11px; }
    </style>
</head>
