<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Study Planner</title>

<style>

body{
background:#020f2b;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
}

h1{
text-align:center;
}

input,textarea{
width:100%;
padding:12px;
margin-bottom:15px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:12px;
background:#2d8cff;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

.result{
background:#0c1f4d;
padding:20px;
border-radius:15px;
margin-top:20px;
white-space:pre-wrap;
}

</style>
</head>

<body>

<div class="container">

<h1>📅 AI Study Planner</h1>

<input
type="date"
id="examDate"
>

<input
type="text"
id="subjects"
placeholder="Example: Mathematics, English, Physics"
>

<input
type="number"
id="hours"
placeholder="Hours available per day"
>

<button onclick="generatePlan()">
Create Study Plan
</button>

<div id="result" class="result">
Your study plan will appear here.
</div>

</div>

<script>

async function generatePlan(){

let examDate =
document.getElementById("examDate").value;

let subjects =
document.getElementById("subjects").value;

let hours =
document.getElementById("hours").value;

if(
examDate === "" ||
subjects === "" ||
hours === ""
){
alert("Fill all fields");
return;
}

document.getElementById("result").innerHTML =
"🤖 Creating study plan...";

try{

const response = await fetch(
"https://kumskid-nova-ai.pages.dev/groq",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

model:"llama-3.3-70b-versatile",

messages:[
{
role:"system",
content:`
You are KUMSKID AI Study Planner.

Create a realistic study timetable.

Include:

1. Daily schedule
2. Subject allocation
3. Revision periods
4. Exam preparation tips

Use clear formatting.
`
},
{
role:"user",
content:
"Exam Date: " + examDate +
"\nSubjects: " + subjects +
"\nHours Per Day: " + hours
}
],

temperature:0.5

})
}
);

const data = await response.json();

let plan =
data.choices?.[0]?.message?.content ||
"No study plan generated.";

document.getElementById("result").innerText =
plan;

}
catch(error){

document.getElementById("result").innerHTML =
"❌ Error creating study plan.";

console.log(error);

}

}

</script>

</body>
</html>
